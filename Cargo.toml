[package]
name = "tickeys-windows"
version = "1.0.3"
edition = "2021"
authors = ["ciyilian"]
build = "build.rs"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
winres = "0.1"
